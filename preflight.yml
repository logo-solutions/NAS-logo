---
# Vérifications pré-déploiement NAS-logo
# Usage : make preflight

- name: Preflight NAS-logo
  hosts: macmini
  gather_facts: true

  tasks:
    - name: "Vérifier que le SSD est monté"
      ansible.builtin.stat:
        path: "{{ ssd_mount_point }}"
      register: ssd_stat
      failed_when: not ssd_stat.stat.exists or not ssd_stat.stat.isdir
      tags: [preflight, stockage]

    - name: "Vérifier l'espace disque SSD (minimum 20 GB libres)"
      ansible.builtin.shell:
        cmd: df -g "{{ ssd_mount_point }}" | awk 'NR==2 {print $4}'
      register: ssd_free_gb
      changed_when: false
      failed_when: ssd_free_gb.stdout | int < 20
      tags: [preflight, stockage]

    - name: "Vérifier que Tailscale authkey est configurée"
      ansible.builtin.assert:
        that:
          - vault_tailscale_authkey != "CHANGE_ME"
          - vault_tailscale_authkey | length > 0
        fail_msg: "vault_tailscale_authkey non configurée dans vault.yml"
      tags: [preflight, tailscale]

    - name: "Vérifier la joignabilité Hetzner Storage Box"
      ansible.builtin.wait_for:
        host: "{{ vault_hetzner_host }}"
        port: 22
        timeout: 10
      ignore_errors: true
      register: hetzner_check
      tags: [preflight, sauvegarde]

    - name: "Avertissement si Hetzner inaccessible"
      ansible.builtin.debug:
        msg: "AVERTISSEMENT : Hetzner Storage Box inaccessible ({{ vault_hetzner_host }}:22). La sauvegarde échouera."
      when: hetzner_check is failed
      tags: [preflight, sauvegarde]

    - name: "Vérifier que les secrets vault ne sont pas des placeholders"
      ansible.builtin.assert:
        that:
          - vault_grafana_admin_password != "CHANGE_ME"
        fail_msg: "Des secrets vault.yml ont des valeurs placeholder. Complétez-les avant de déployer."
      tags: [preflight, secrets]

    - name: "Préflight réussi"
      ansible.builtin.debug:
        msg: "Tous les prérequis sont satisfaits. Lancez : make install"
      tags: [preflight]
