---
# Test d'accès externe via Tailscale — à lancer depuis ton laptop (pas le Mac Mini)
# Usage : ansible-playbook tailscale-test.yml
#
# Prérequis : Tailscale actif sur le laptop (tailscale up)
# Ce playbook tourne entièrement en local et tente de joindre
# le Mac Mini via son IP Tailscale (100.113.214.55)

- name: "Test accès Tailscale — NAS-logo depuis l'extérieur"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    nas_ip: "100.113.214.55"
    immich_port: 2283
    paperless_port: 8010
    grafana_port: 3000
    prometheus_port: 9090
    meilisearch_port: 7700
    meilisearch_ui_port: 7701
    ntfy_port: 8090
    timeout: 10

  tasks:

    - name: "Vérifier que Tailscale tourne localement"
      ansible.builtin.command: tailscale status --json
      register: local_ts
      changed_when: false
      failed_when: (local_ts.stdout | from_json).BackendState != "Running"

    - name: "Ping Tailscale vers le Mac Mini"
      ansible.builtin.command: tailscale ping --c 3 {{ nas_ip }}
      register: ts_ping
      changed_when: false
      failed_when: ts_ping.rc != 0

    - name: "Résultat ping Tailscale"
      ansible.builtin.debug:
        msg: "{{ ts_ping.stdout_lines }}"

    - name: "Test Immich ({{ nas_ip }}:{{ immich_port }})"
      ansible.builtin.uri:
        url: "http://{{ nas_ip }}:{{ immich_port }}/api/server/ping"
        timeout: "{{ timeout }}"
        status_code: 200
      register: r_immich

    - name: "Test Paperless ({{ nas_ip }}:{{ paperless_port }})"
      ansible.builtin.uri:
        url: "http://{{ nas_ip }}:{{ paperless_port }}/api/"
        timeout: "{{ timeout }}"
        status_code: [200, 401]
      register: r_paperless

    - name: "Test Grafana ({{ nas_ip }}:{{ grafana_port }})"
      ansible.builtin.uri:
        url: "http://{{ nas_ip }}:{{ grafana_port }}/api/health"
        timeout: "{{ timeout }}"
        status_code: 200
      register: r_grafana

    - name: "Test Prometheus ({{ nas_ip }}:{{ prometheus_port }})"
      ansible.builtin.uri:
        url: "http://{{ nas_ip }}:{{ prometheus_port }}/-/healthy"
        timeout: "{{ timeout }}"
        status_code: 200
      register: r_prometheus

    - name: "Test Meilisearch ({{ nas_ip }}:{{ meilisearch_port }})"
      ansible.builtin.uri:
        url: "http://{{ nas_ip }}:{{ meilisearch_port }}/health"
        timeout: "{{ timeout }}"
        status_code: 200
      register: r_meilisearch

    - name: "Test ntfy ({{ nas_ip }}:{{ ntfy_port }})"
      ansible.builtin.uri:
        url: "http://{{ nas_ip }}:{{ ntfy_port }}/v1/health"
        timeout: "{{ timeout }}"
        status_code: 200
      register: r_ntfy

    - name: "Récapitulatif"
      ansible.builtin.debug:
        msg:
          - "Tailscale ping  : OK"
          - "Immich          : {{ r_immich.status }}"
          - "Paperless       : {{ r_paperless.status }}"
          - "Grafana         : {{ r_grafana.status }}"
          - "Prometheus      : {{ r_prometheus.status }}"
          - "Meilisearch     : {{ r_meilisearch.status }}"
          - "ntfy            : {{ r_ntfy.status }}"
