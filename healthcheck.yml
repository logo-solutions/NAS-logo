---
# healthcheck.yml — Health check complet
# Disponible à tout moment, indépendant de la séquence d'installation
# Usage : make health

- name: "Health check — Immich Mac Mini"
  hosts: macmini
  gather_facts: false

  vars_files:
    - inventory/group_vars/vault.yml

  vars:
    checks: []

  tasks:

    # --- Immich ---
    - name: Ping Immich API
      uri:
        url: "http://localhost:{{ immich_port }}/api/server-info/ping"
        status_code: 200
        timeout: 5
      register: immich_ping
      ignore_errors: true

    # --- Conteneurs Docker ---
    - name: Vérifier les conteneurs Docker
      command: docker inspect --format="{{ '{{' }}.State.Status{{ '}}' }}" {{ item }}
      loop:
        - immich_server
        - immich_postgres
        - immich_redis
        - immich_machine_learning
      register: containers
      changed_when: false
      ignore_errors: true

    # --- SSD ---
    - name: Vérifier le SSD
      stat:
        path: "{{ ssd_mount_point }}"
      register: ssd_check
      ignore_errors: true

    - name: Espace disque SSD
      shell: df -g "{{ ssd_mount_point }}" | awk 'NR==2 {print $5}' | tr -d '%'
      register: disk_usage
      changed_when: false
      ignore_errors: true

    # --- Hetzner ---
    - name: Accès Hetzner Storage Box
      command: >
        rclone lsd hetzner:
        --config {{ ansible_env.HOME }}/.config/rclone/rclone.conf
        --contimeout 10s
      register: hetzner_check
      changed_when: false
      ignore_errors: true

    # --- Tailscale ---
    - name: Statut Tailscale
      command: tailscale status
      register: tailscale_check
      changed_when: false
      ignore_errors: true

    # --- Sauvegarde ---
    - name: Date du dernier backup
      shell: >
        ls -t {{ ansible_env.HOME }}/immich/logs/backup.log 2>/dev/null
        && tail -1 {{ ansible_env.HOME }}/immich/logs/backup.log
        || echo "Aucun log trouvé"
      register: last_backup
      changed_when: false
      ignore_errors: true

    # --- MCP Claude (si installé) ---
    - name: Vérifier Claude Code
      command: claude --version
      register: claude_check
      changed_when: false
      ignore_errors: true
      environment:
        PATH: "/opt/homebrew/bin:/usr/local/bin:{{ ansible_env.PATH }}"

    # --- Rapport final ---
    - name: "Rapport health check"
      debug:
        msg:
          - "========================================"
          - "  Health check Immich — {{ ansible_date_time.date | default('N/A') }}"
          - "========================================"
          - ""
          - "  Immich API     : {{ 'OK' if immich_ping.status == 200 else 'KO' }}"
          - "  immich_server  : {{ containers.results[0].stdout | default('absent') }}"
          - "  immich_postgres: {{ containers.results[1].stdout | default('absent') }}"
          - "  immich_redis   : {{ containers.results[2].stdout | default('absent') }}"
          - "  immich_ml      : {{ containers.results[3].stdout | default('absent') }}"
          - ""
          - "  SSD monté      : {{ 'OK' if ssd_check.stat.exists else 'KO' }}"
          - "  Disque utilisé : {{ disk_usage.stdout | trim }}%"
          - "  Hetzner        : {{ 'OK' if hetzner_check.rc == 0 else 'KO' }}"
          - "  Tailscale      : {{ 'OK' if tailscale_check.rc == 0 else 'KO' }}"
          - ""
          - "  Dernier backup : {{ last_backup.stdout_lines | last | default('inconnu') }}"
          - ""
          - "  Claude Code    : {{ claude_check.stdout | trim if claude_check.rc == 0 else 'non installé' }}"
          - "========================================"

    # --- Alerte ntfy si problème ---
    - name: Alerte ntfy si Immich est down
      uri:
        url: "https://ntfy.sh/{{ ntfy_topic }}"
        method: POST
        body: "Health check : Immich ne répond pas sur {{ inventory_hostname }}"
        headers:
          Content-Type: "text/plain"
      when: immich_ping.status is not defined or immich_ping.status != 200
      ignore_errors: true
