---
# Health check complet NAS-logo
# Usage : make health
# Tags disponibles : stockage, docker, immich, monitoring, paperless, n8n, whisper, tailscale, backup, smb

- name: Health check NAS-logo
  hosts: macmini
  gather_facts: true

  tasks:

    # ── Stockage ────────────────────────────────────────────────────────────────

    - name: "Vérifier que le SSD est monté"
      ansible.builtin.stat:
        path: "{{ ssd_mount_point }}"
      register: ssd_stat
      failed_when: not ssd_stat.stat.exists
      tags: [health, stockage]

    - name: "Vérifier l'espace disque SSD (alerte si > {{ alert_disk_threshold }}%)"
      ansible.builtin.shell:
        cmd: df -h "{{ ssd_mount_point }}" | awk 'NR==2 {gsub(/%/,"",$5); print $5}'
      register: ssd_usage_pct
      changed_when: false
      tags: [health, stockage]

    - name: "Alerte disque SSD"
      ansible.builtin.debug:
        msg: "ALERTE : SSD utilisé à {{ ssd_usage_pct.stdout }}% (seuil : {{ alert_disk_threshold }}%)"
      when: ssd_usage_pct.stdout | int > alert_disk_threshold | int
      tags: [health, stockage]

    # ── Docker / Colima ─────────────────────────────────────────────────────────

    - name: "Vérifier que le LaunchAgent Colima est chargé"
      ansible.builtin.command:
        cmd: launchctl list com.nas-logo.colima
      register: colima_agent
      changed_when: false
      failed_when: colima_agent.rc != 0
      tags: [health, docker]

    - name: "Vérifier que Colima tourne"
      ansible.builtin.command:
        cmd: /opt/homebrew/bin/colima status
      environment:
        PATH: "/opt/homebrew/bin:{{ ansible_env.PATH }}"
      register: colima_status
      changed_when: false
      failed_when: "'running' not in colima_status.stderr"
      tags: [health, docker]

    - name: "Lister les conteneurs Docker unhealthy ou exited"
      ansible.builtin.shell:
        cmd: >
          DOCKER_HOST=unix:///Users/{{ ansible_user_id }}/.colima/default/docker.sock
          /opt/homebrew/bin/docker ps -a --filter 'status=exited' --filter 'status=dead'
          --filter 'health=unhealthy' --format '{{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}'
      register: docker_unhealthy
      changed_when: false
      tags: [health, docker]

    - name: "Alerte conteneurs en erreur"
      ansible.builtin.debug:
        msg: "ALERTE conteneurs :\n{{ docker_unhealthy.stdout }}"
      when: docker_unhealthy.stdout | length > 0
      tags: [health, docker]

    - name: "Compter les conteneurs en cours d'exécution"
      ansible.builtin.shell:
        cmd: >
          DOCKER_HOST=unix:///Users/{{ ansible_user_id }}/.colima/default/docker.sock
          /opt/homebrew/bin/docker ps -q | wc -l | tr -d ' '
      register: docker_running_count
      changed_when: false
      tags: [health, docker]

    - name: "Afficher le nombre de conteneurs actifs"
      ansible.builtin.debug:
        msg: "Conteneurs actifs : {{ docker_running_count.stdout }}"
      tags: [health, docker]

    # ── Immich ──────────────────────────────────────────────────────────────────

    - name: "Vérifier qu'Immich répond (port {{ immich_port }})"
      ansible.builtin.uri:
        url: "http://localhost:{{ immich_port }}/api/server/ping"
        method: GET
        status_code: 200
        timeout: 10
      tags: [health, immich]

    # ── Paperless ───────────────────────────────────────────────────────────────

    - name: "Vérifier que Paperless répond (port {{ paperless_port }})"
      ansible.builtin.uri:
        url: "http://localhost:{{ paperless_port }}/accounts/login/"
        method: GET
        status_code: 200
        timeout: 10
      tags: [health, paperless]

    # ── Monitoring ──────────────────────────────────────────────────────────────

    - name: "Vérifier que Grafana répond (port {{ grafana_port }})"
      ansible.builtin.uri:
        url: "http://localhost:{{ grafana_port }}/api/health"
        method: GET
        status_code: 200
        timeout: 10
      tags: [health, monitoring]

    - name: "Vérifier que Prometheus répond (port {{ prometheus_port }})"
      ansible.builtin.uri:
        url: "http://localhost:{{ prometheus_port }}/-/healthy"
        method: GET
        status_code: 200
        timeout: 10
      tags: [health, monitoring]

    - name: "Vérifier que cAdvisor répond (port {{ cadvisor_port }})"
      ansible.builtin.uri:
        url: "http://localhost:{{ cadvisor_port }}/healthz"
        method: GET
        status_code: 200
        timeout: 10
      tags: [health, monitoring]

    - name: "Vérifier que node-exporter répond (port 9100)"
      ansible.builtin.uri:
        url: "http://localhost:9100/metrics"
        method: GET
        status_code: 200
        timeout: 10
      tags: [health, monitoring]

    - name: "Vérifier que Alertmanager répond (port 9093)"
      ansible.builtin.uri:
        url: "http://localhost:9093/-/healthy"
        method: GET
        status_code: 200
        timeout: 10
      tags: [health, monitoring]

    - name: "Vérifier que ntfy répond (port {{ ntfy_port }})"
      ansible.builtin.uri:
        url: "http://localhost:{{ ntfy_port }}/v1/health"
        method: GET
        status_code: 200
        timeout: 10
      tags: [health, monitoring]

    # ── n8n ─────────────────────────────────────────────────────────────────────

    - name: "Vérifier que n8n répond (port {{ n8n_port }})"
      ansible.builtin.uri:
        url: "http://localhost:{{ n8n_port }}/healthz"
        method: GET
        status_code: 200
        timeout: 10
      tags: [health, n8n]

    # ── Whisper ─────────────────────────────────────────────────────────────────

    - name: "Vérifier que Whisper répond (port {{ whisper_port }})"
      ansible.builtin.uri:
        url: "http://localhost:{{ whisper_port }}/health"
        method: GET
        status_code: 200
        timeout: 10
      tags: [health, whisper]

    # ── SMB ─────────────────────────────────────────────────────────────────────

    - name: "Vérifier que le partage SMB NAS-LOGO-VOLUME est actif"
      ansible.builtin.shell:
        cmd: sharing -l | grep -c 'NAS-LOGO-VOLUME'
      register: smb_share_count
      changed_when: false
      failed_when: smb_share_count.stdout | int == 0
      tags: [health, smb]

    - name: "Vérifier que le port SMB 445 écoute"
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: 445
        timeout: 5
        state: started
      tags: [health, smb]

    # ── Tailscale ───────────────────────────────────────────────────────────────

    - name: "Vérifier que Tailscale est connecté"
      ansible.builtin.command:
        cmd: /usr/local/bin/tailscale status --json
      register: tailscale_status
      changed_when: false
      failed_when: (tailscale_status.stdout | from_json).BackendState != "Running"
      tags: [health, tailscale]

    - name: "Récupérer l'IP Tailscale courante"
      ansible.builtin.set_fact:
        ts_ip: "{{ (tailscale_status.stdout | from_json).TailscaleIPs | first }}"
      tags: [health, tailscale]

    - name: "Vérifier l'IP Tailscale attendue"
      ansible.builtin.assert:
        that: ts_ip == nas_ip
        fail_msg: "IP Tailscale inattendue : {{ ts_ip }} (attendu : {{ nas_ip }})"
        success_msg: "IP Tailscale OK : {{ ts_ip }}"
      tags: [health, tailscale]

    - name: "Vérifier Immich via IP Tailscale (simulation externe)"
      ansible.builtin.uri:
        url: "http://{{ nas_ip }}:{{ immich_port }}/api/server/ping"
        method: GET
        status_code: 200
        timeout: 10
      tags: [health, tailscale]

    - name: "Vérifier Paperless via IP Tailscale (simulation externe)"
      ansible.builtin.uri:
        url: "http://{{ nas_ip }}:{{ paperless_port }}/accounts/login/"
        method: GET
        status_code: 200
        timeout: 10
      tags: [health, tailscale]

    - name: "Vérifier Grafana via IP Tailscale (simulation externe)"
      ansible.builtin.uri:
        url: "http://{{ nas_ip }}:{{ grafana_port }}/api/health"
        method: GET
        status_code: 200
        timeout: 10
      tags: [health, tailscale]

    - name: "Vérifier Meilisearch via IP Tailscale (simulation externe)"
      ansible.builtin.uri:
        url: "http://{{ nas_ip }}:{{ meilisearch_port }}/health"
        method: GET
        status_code: 200
        timeout: 10
      tags: [health, tailscale]

    - name: "Vérifier n8n via IP Tailscale (simulation externe)"
      ansible.builtin.uri:
        url: "http://{{ nas_ip }}:{{ n8n_port }}/healthz"
        method: GET
        status_code: 200
        timeout: 10
      tags: [health, tailscale]

    # ── Sauvegarde ──────────────────────────────────────────────────────────────

    - name: "Vérifier la connectivité SSH vers Hetzner (port 22)"
      ansible.builtin.wait_for:
        host: "{{ hetzner_host }}"
        port: 22
        timeout: 10
        state: started
      register: hetzner_ssh_check
      tags: [health, backup]

    - name: "Vérifier la connectivité SFTP vers Hetzner (port 23)"
      ansible.builtin.wait_for:
        host: "{{ hetzner_host }}"
        port: 23
        timeout: 10
        state: started
      register: hetzner_sftp_check
      failed_when: false
      changed_when: false
      tags: [health, backup]

    - name: "ALERTE — Port SFTP 23 indisponible sur Hetzner"
      ansible.builtin.debug:
        msg: "ALERTE CRITIQUE : Port SFTP 23 indisponible sur {{ hetzner_host }} — backups rclone risquent d'échouer."
      when: hetzner_sftp_check.state != 'started'
      tags: [health, backup]

    - name: "Tester la connectivité rclone vers Hetzner"
      ansible.builtin.shell:
        cmd: "{{ rclone_bin | default('/opt/homebrew/bin/rclone') }} lsd hetzner-crypt:current 2>&1 | head -5"
      environment:
        HOME: "{{ ansible_env.HOME }}"
      register: rclone_test
      changed_when: false
      failed_when: false
      tags: [health, backup]

    - name: "ALERTE — rclone Hetzner inaccessible"
      ansible.builtin.debug:
        msg: "ALERTE : rclone ne peut pas accéder à Hetzner — {{ rclone_test.stderr | default(rclone_test.stdout) }}"
      when: rclone_test.rc != 0
      tags: [health, backup]

    - name: "Vérifier l'existence du répertoire de backup"
      ansible.builtin.stat:
        path: "{{ backup_dir }}"
      register: backup_dir_stat
      tags: [health, backup]

    - name: "Trouver le plus récent dump PostgreSQL"
      ansible.builtin.find:
        paths: "{{ backup_dir }}"
        patterns: "*.dump"
        file_type: file
      register: backup_dumps
      tags: [health, backup]

    - name: "Récupérer les stats du dernier dump"
      ansible.builtin.stat:
        path: "{{ backup_dumps.files | sort(attribute='mtime', reverse=true) | first | default({}) | attr('path', default='') }}"
      register: latest_dump_stat
      when: backup_dumps.files | length > 0
      tags: [health, backup]

    - name: "Afficher l'état du dernier dump"
      ansible.builtin.debug:
        msg: >
          Dernier dump PostgreSQL :
          {{ (backup_dumps.files | sort(attribute='mtime', reverse=true) | first).path | basename }}
          ({{ (latest_dump_stat.stat.size | int / 1024 / 1024) | round(1) }}MB,
          {% set age_seconds = (ansible_date_time.epoch | int) - (latest_dump_stat.stat.mtime | int) %}
          {% set age_hours = age_seconds // 3600 %}
          {% if age_hours == 0 %}freshe ({{ (age_seconds // 60) }}min)
          {% else %}{{ age_hours }}h ago
          {% endif %})
      when: backup_dumps.files | length > 0
      tags: [health, backup]

    - name: "ALERTE — Aucun dump PostgreSQL trouvé"
      ansible.builtin.debug:
        msg: "ALERTE : Aucun dump PostgreSQL trouvé dans {{ backup_dir }} — vérifier le rôle sauvegarde."
      when: backup_dumps.files | length == 0
      tags: [health, backup]

    - name: "Vérifier l'âge du log de sauvegarde"
      ansible.builtin.find:
        paths: "{{ ansible_env.HOME }}/Library/Logs/nas-logo"
        patterns: "backup-*.log"
        age: "-25h"
        age_stamp: mtime
      register: backup_log_recent
      tags: [health, backup]

    - name: "Afficher le log le plus récent"
      ansible.builtin.find:
        paths: "{{ ansible_env.HOME }}/Library/Logs/nas-logo"
        patterns: "backup-*.log"
        file_type: file
      register: all_backup_logs
      tags: [health, backup]

    - name: "Stats du log de sauvegarde le plus récent"
      ansible.builtin.stat:
        path: "{{ (all_backup_logs.files | sort(attribute='mtime', reverse=true) | first | default({}) | attr('path', default='')) }}"
      register: latest_log_stat
      when: all_backup_logs.files | length > 0
      tags: [health, backup]

    - name: "Afficher l'état du dernier log de backup"
      ansible.builtin.debug:
        msg: >
          Dernier log de sauvegarde :
          {{ (all_backup_logs.files | sort(attribute='mtime', reverse=true) | first).path | basename }}
          ({% set age_seconds = (ansible_date_time.epoch | int) - (latest_log_stat.stat.mtime | int) %}
          {% set age_hours = age_seconds // 3600 %}
          {% if age_hours == 0 %}freshe ({{ (age_seconds // 60) }}min ago)
          {% else %}{{ age_hours }}h ago
          {% endif %})
      when: all_backup_logs.files | length > 0
      tags: [health, backup]

    - name: "ALERTE — Aucun log de sauvegarde depuis 25h"
      ansible.builtin.debug:
        msg: "ALERTE : Le log de sauvegarde n'a pas été modifié depuis plus de 25h — vérifier la launchd job."
      when: backup_log_recent.matched == 0
      tags: [health, backup]

    # ── UPS ─────────────────────────────────────────────────────────────────────

    - name: "Vérifier que le UPS est détecté par macOS"
      ansible.builtin.shell:
        cmd: pmset -g batt | grep -i "Back-UPS"
      register: ups_status
      changed_when: false
      failed_when: ups_status.rc != 0
      tags: [health, ups]

    - name: "Vérifier que le UPS est sur secteur ou batterie"
      ansible.builtin.shell:
        cmd: pmset -g batt | grep -i "Back-UPS" | awk -F';' '{print $1}' | awk '{print $NF}'
      register: ups_charge
      changed_when: false
      tags: [health, ups]

    - name: "Alerte batterie UPS faible"
      ansible.builtin.debug:
        msg: "ALERTE UPS : batterie à {{ ups_charge.stdout }} (seuil : 50%)"
      when: ups_charge.stdout | regex_search('[0-9]+') | int < 50
      tags: [health, ups]

    - name: "Résumé UPS"
      ansible.builtin.debug:
        msg: "UPS détecté : {{ ups_status.stdout.strip() }}"
      tags: [health, ups]

    # ── Résumé ──────────────────────────────────────────────────────────────────

    - name: "Health check complet réussi"
      ansible.builtin.debug:
        msg: >
          Tous les services sont opérationnels.
          SSD : {{ ssd_usage_pct.stdout }}% utilisé.
          Conteneurs actifs : {{ docker_running_count.stdout }}.
          IP Tailscale : {{ ts_ip }}.
      tags: [health]
