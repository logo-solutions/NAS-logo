---
# roles/stockage — Vérification du SSD et création de l'arborescence

- name: "Vérifier que le SSD est monté"
  ansible.builtin.stat:
    path: "{{ ssd_mount_point }}"
  register: ssd_stat
  failed_when: not ssd_stat.stat.exists or not ssd_stat.stat.isdir
  tags: [stockage]

- name: "Créer l'arborescence des données sur le SSD"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ immich_data_dir }}"
    - "{{ immich_db_dir }}"
    - "{{ monitoring_data_dir }}/prometheus"
    - "{{ monitoring_data_dir }}/grafana"
    - "{{ backup_dir }}"
  tags: [stockage]

- name: "Déployer script de montage Expansion12"
  ansible.builtin.template:
    src: expansion12-mount.sh.j2
    dest: /usr/local/bin/nas-logo-expansion12-mount.sh
    mode: "0755"
  tags: [stockage]

- name: "Déployer LaunchDaemon pour montage automatique Expansion12"
  ansible.builtin.template:
    src: com.nas-logo.expansion12-mount.plist.j2
    dest: /Library/LaunchDaemons/com.nas-logo.expansion12-mount.plist
    mode: "0644"
  become: true
  notify: "load launchdaemon expansion12"
  tags: [stockage]
