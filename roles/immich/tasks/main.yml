---
# roles/immich — Déploiement Immich via Docker Compose

- name: "Créer le répertoire d'installation Immich"
  ansible.builtin.file:
    path: "{{ immich_install_dir }}"
    state: directory
    mode: "0750"
  tags: [immich]

- name: "Déployer le fichier .env Immich"
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ immich_install_dir }}/.env"
    mode: "0600"
  no_log: true
  notify: restart immich
  tags: [immich]

- name: "Déployer docker-compose.yml Immich"
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ immich_install_dir }}/docker-compose.yml"
    mode: "0640"
  notify: restart immich
  tags: [immich]

- name: "Démarrer la stack Immich"
  community.docker.docker_compose_v2:
    project_src: "{{ immich_install_dir }}"
    state: present
    pull: always
    docker_cli: "{{ docker_bin }}"
  environment:
    DOCKER_HOST: "{{ docker_host }}"
  tags: [immich]

- name: "Attendre qu'Immich soit opérationnel"
  ansible.builtin.uri:
    url: "http://localhost:{{ immich_port }}/api/server/ping"
    method: GET
    status_code: 200
    timeout: 10
  retries: 30
  delay: 10
  register: immich_ping
  until: immich_ping.status == 200
  tags: [immich]

# ── Comptes famille ────────────────────────────────────────────────────────────

- name: "Lister les utilisateurs Immich existants"
  ansible.builtin.uri:
    url: "http://localhost:{{ immich_port }}/api/users"
    method: GET
    headers:
      x-api-key: "{{ immich_api_key }}"
    return_content: true
  register: immich_existing_users
  check_mode: false
  failed_when: false
  tags: [immich]

- name: "Créer les comptes Immich manquants"
  ansible.builtin.uri:
    url: "http://localhost:{{ immich_port }}/api/users"
    method: POST
    headers:
      x-api-key: "{{ immich_api_key }}"
      Content-Type: "application/json"
    body_format: json
    body:
      email: "{{ item.email }}"
      name: "{{ item.name }}"
      password: "{{ item.password }}"
    status_code: [200, 201]
  loop: "{{ immich_users }}"
  loop_control:
    label: "{{ item.email }}"
  when:
    - immich_existing_users.status | default(-1) == 200
    - item.email not in (immich_existing_users.json | default([]) | map(attribute='email') | list)
  changed_when: true
  tags: [immich]

# ── Album Famille ──────────────────────────────────────────────────────────────

- name: "Lister les utilisateurs Immich (post-création)"
  ansible.builtin.uri:
    url: "http://localhost:{{ immich_port }}/api/users"
    method: GET
    headers:
      x-api-key: "{{ immich_api_key }}"
    return_content: true
  register: immich_all_users
  check_mode: false
  failed_when: false
  tags: [immich]

- name: "Construire la liste des userId famille"
  ansible.builtin.set_fact:
    famille_album_users: "{{ famille_album_users | default([]) + [{'userId': item.id, 'role': 'editor'}] }}"
  loop: "{{ immich_all_users.json | default([]) | selectattr('email', 'in', immich_users | map(attribute='email') | list) | list }}"
  loop_control:
    label: "{{ item.email }}"
  when: immich_all_users.status | default(-1) == 200
  tags: [immich]

- name: "Lister les albums Immich"
  ansible.builtin.uri:
    url: "http://localhost:{{ immich_port }}/api/albums"
    method: GET
    headers:
      x-api-key: "{{ immich_api_key }}"
    return_content: true
  register: immich_all_albums
  check_mode: false
  failed_when: false
  tags: [immich]

- name: "Créer l'album Famille"
  ansible.builtin.uri:
    url: "http://localhost:{{ immich_port }}/api/albums"
    method: POST
    headers:
      x-api-key: "{{ immich_api_key }}"
      Content-Type: "application/json"
    body_format: json
    body:
      albumName: "Famille"
    status_code: [200, 201]
  when:
    - immich_all_albums.status | default(-1) == 200
    - '"Famille" not in (immich_all_albums.json | default([]) | map(attribute="albumName") | list)'
  register: immich_famille_created
  changed_when: true
  tags: [immich]

- name: "Récupérer l'ID de l'album Famille"
  ansible.builtin.set_fact:
    famille_album_id: >-
      {{ (immich_all_albums.json | default([]) | selectattr('albumName', 'equalto', 'Famille') | list | first).id
         if 'Famille' in (immich_all_albums.json | default([]) | map(attribute='albumName') | list)
         else (immich_famille_created.json.id | default('')) }}
  when: immich_all_albums.status | default(-1) == 200
  tags: [immich]

- name: "Partager l'album Famille avec alban et ilan"
  ansible.builtin.uri:
    url: "http://localhost:{{ immich_port }}/api/albums/{{ famille_album_id }}/users"
    method: PUT
    headers:
      x-api-key: "{{ immich_api_key }}"
      Content-Type: "application/json"
    body_format: json
    body:
      albumUsers: "{{ famille_album_users | default([]) }}"
    status_code: [200, 201]
  when:
    - immich_all_albums.status | default(-1) == 200
    - famille_album_users | default([]) | length > 0
  changed_when: false
  tags: [immich]
