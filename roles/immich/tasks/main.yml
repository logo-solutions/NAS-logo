---
# roles/immich — Déploiement Immich via Docker Compose

- name: "Créer le répertoire d'installation Immich"
  ansible.builtin.file:
    path: "{{ immich_install_dir }}"
    state: directory
    mode: "0750"
  tags: [immich]

- name: "Déployer le fichier .env Immich"
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ immich_install_dir }}/.env"
    mode: "0600"
  no_log: true
  notify: restart immich
  tags: [immich]

- name: "Déployer docker-compose.yml Immich"
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ immich_install_dir }}/docker-compose.yml"
    mode: "0640"
  notify: restart immich
  tags: [immich]

- name: "Démarrer la stack Immich"
  community.docker.docker_compose_v2:
    project_src: "{{ immich_install_dir }}"
    state: present
    pull: always
    docker_cli: "{{ docker_bin }}"
  environment:
    DOCKER_HOST: "{{ docker_host }}"
  tags: [immich]

- name: "Attendre qu'Immich soit opérationnel"
  ansible.builtin.uri:
    url: "http://localhost:{{ immich_port }}/api/server/ping"
    method: GET
    status_code: 200
    timeout: 10
  retries: 30
  delay: 10
  register: immich_ping
  until: immich_ping.status == 200
  tags: [immich]
