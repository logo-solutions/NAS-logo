---
- name: restart n8n
  community.docker.docker_compose_v2:
    project_src: "{{ ansible_env.HOME }}/n8n"
    state: restarted
    docker_cli: "{{ docker_bin }}"
  environment:
    DOCKER_HOST: "{{ docker_host }}"
  when: not ansible_check_mode

- name: restart fswatch-triage
  ansible.builtin.shell: |
    launchctl unload "{{ ansible_env.HOME }}/Library/LaunchAgents/com.nas-logo.fswatch-triage.plist" 2>/dev/null || true
    launchctl load -w "{{ ansible_env.HOME }}/Library/LaunchAgents/com.nas-logo.fswatch-triage.plist"
  changed_when: true
  when: not ansible_check_mode
