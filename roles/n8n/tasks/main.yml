---
# roles/n8n — Automatisation de workflows

- name: "Créer le répertoire n8n sur le SSD"
  ansible.builtin.file:
    path: "{{ n8n_data_dir }}/data"
    state: directory
    mode: "0750"
  tags: [n8n]

- name: "Créer le répertoire de déploiement n8n"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/n8n"
    state: directory
    mode: "0750"
  tags: [n8n]

- name: "Déployer docker-compose.n8n.yml"
  ansible.builtin.template:
    src: docker-compose.n8n.yml.j2
    dest: "{{ ansible_env.HOME }}/n8n/docker-compose.yml"
    mode: "0640"
  notify: restart n8n
  tags: [n8n]

- name: "Démarrer la stack n8n"
  community.docker.docker_compose_v2:
    project_src: "{{ ansible_env.HOME }}/n8n"
    state: present
    pull: missing
    docker_cli: "{{ docker_bin }}"
  environment:
    DOCKER_HOST: "{{ docker_host }}"
    PATH: "/Applications/Docker.app/Contents/Resources/bin:{{ ansible_env.PATH }}"
  when: not ansible_check_mode
  tags: [n8n]

- name: "Attendre que n8n soit prêt"
  ansible.builtin.uri:
    url: "http://localhost:{{ n8n_port }}/healthz"
    method: GET
    status_code: 200
    timeout: 10
  retries: 12
  delay: 10
  register: n8n_health
  until: n8n_health.status == 200
  when: not ansible_check_mode
  tags: [n8n]

- name: "Vérifier si les credentials SSH ont déjà été importés"
  ansible.builtin.stat:
    path: "{{ n8n_data_dir }}/.credentials_imported"
  register: credentials_marker
  tags: [n8n]

- name: "Préparer les credentials SSH n8n (temporaire)"
  ansible.builtin.template:
    src: credentials-ssh.json.j2
    dest: "{{ n8n_data_dir }}/data/credentials-ssh.json"
    mode: "0600"
  no_log: true
  when: not credentials_marker.stat.exists and not ansible_check_mode
  tags: [n8n]

- name: "Importer les credentials SSH dans n8n"
  ansible.builtin.shell: >
    {{ docker_bin }} exec n8n
    n8n import:credentials --input=/home/node/.n8n/credentials-ssh.json
  environment:
    DOCKER_HOST: "{{ docker_host }}"
  when: not credentials_marker.stat.exists and not ansible_check_mode
  changed_when: true
  no_log: true
  tags: [n8n]

- name: "Supprimer le fichier credentials (sécurité)"
  ansible.builtin.file:
    path: "{{ n8n_data_dir }}/data/credentials-ssh.json"
    state: absent
  when: not ansible_check_mode
  tags: [n8n]

- name: "Marquer les credentials SSH comme importés"
  ansible.builtin.file:
    path: "{{ n8n_data_dir }}/.credentials_imported"
    state: touch
    mode: "0600"
  when: not credentials_marker.stat.exists and not ansible_check_mode
  tags: [n8n]

- name: "Vérifier si le workflow triage a été importé"
  ansible.builtin.stat:
    path: "{{ n8n_data_dir }}/.workflow_triage_imported"
  register: workflow_triage_marker
  tags: [n8n]

- name: "Préparer le workflow triage (temporaire)"
  ansible.builtin.template:
    src: workflow-triage.json.j2
    dest: "{{ n8n_data_dir }}/data/workflow-triage.json"
    mode: "0600"
  when: not workflow_triage_marker.stat.exists and not ansible_check_mode
  tags: [n8n]

- name: "Copier le workflow triage dans le container"
  ansible.builtin.shell: >
    {{ docker_bin }} cp {{ n8n_data_dir }}/data/workflow-triage.json n8n:/home/node/workflow-triage.json &&
    {{ docker_bin }} exec --user root n8n chmod 644 /home/node/workflow-triage.json
  environment:
    DOCKER_HOST: "{{ docker_host }}"
  when: not workflow_triage_marker.stat.exists and not ansible_check_mode
  changed_when: true
  tags: [n8n]

- name: "Importer le workflow triage dans n8n"
  ansible.builtin.shell: >
    {{ docker_bin }} exec n8n
    n8n import:workflow --input=/home/node/workflow-triage.json
  environment:
    DOCKER_HOST: "{{ docker_host }}"
  when: not workflow_triage_marker.stat.exists and not ansible_check_mode
  changed_when: true
  tags: [n8n]

- name: "Supprimer le fichier workflow temporaire"
  ansible.builtin.file:
    path: "{{ n8n_data_dir }}/data/workflow-triage.json"
    state: absent
  when: not ansible_check_mode
  tags: [n8n]

- name: "Marquer le workflow triage comme importé"
  ansible.builtin.file:
    path: "{{ n8n_data_dir }}/.workflow_triage_imported"
    state: touch
    mode: "0600"
  when: not workflow_triage_marker.stat.exists and not ansible_check_mode
  tags: [n8n]

- name: "Créer le répertoire d'export des workflows"
  ansible.builtin.file:
    path: "{{ n8n_data_dir }}/workflows-backup"
    state: directory
    mode: "0750"
  tags: [n8n]

- name: "Planifier l'export quotidien des workflows n8n"
  ansible.builtin.cron:
    name: "n8n-export-workflows"
    minute: "30"
    hour: "2"
    job: >
      {{ docker_bin }} exec n8n
      n8n export:workflow --all --output=/home/node/.n8n/workflows-backup/workflows-$(date +\%Y\%m\%d).json
      >> /tmp/n8n-export.log 2>&1
    user: "{{ mac_user }}"
  tags: [n8n]

- name: "Installer fswatch via Homebrew"
  community.general.homebrew:
    name: fswatch
    state: present
  tags: [n8n]

- name: "Déployer le script fswatch-triage"
  ansible.builtin.template:
    src: fswatch-triage.sh.j2
    dest: /usr/local/bin/nas-logo-fswatch-triage.sh
    mode: "0755"
  become: true
  notify: restart fswatch-triage
  tags: [n8n]

- name: "Déployer le launchd plist fswatch-triage"
  ansible.builtin.template:
    src: com.nas-logo.fswatch-triage.plist.j2
    dest: "{{ ansible_env.HOME }}/Library/LaunchAgents/com.nas-logo.fswatch-triage.plist"
    mode: "0644"
  notify: restart fswatch-triage
  tags: [n8n]

- name: "Charger le launchd agent fswatch-triage"
  ansible.builtin.command:
    cmd: launchctl load -w "{{ ansible_env.HOME }}/Library/LaunchAgents/com.nas-logo.fswatch-triage.plist"
  register: launchctl_load
  changed_when: launchctl_load.rc == 0
  failed_when: false
  when: not ansible_check_mode
  tags: [n8n]
