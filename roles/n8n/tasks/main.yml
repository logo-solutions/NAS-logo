---
# roles/n8n — Automatisation de workflows

- name: "Créer le répertoire n8n sur le SSD"
  ansible.builtin.file:
    path: "{{ n8n_data_dir }}/data"
    state: directory
    mode: "0750"
  tags: [n8n]

- name: "Créer le répertoire de déploiement n8n"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/n8n"
    state: directory
    mode: "0750"
  tags: [n8n]

- name: "Déployer docker-compose.n8n.yml"
  ansible.builtin.template:
    src: docker-compose.n8n.yml.j2
    dest: "{{ ansible_env.HOME }}/n8n/docker-compose.yml"
    mode: "0640"
  notify: restart n8n
  tags: [n8n]

- name: "Démarrer la stack n8n"
  community.docker.docker_compose_v2:
    project_src: "{{ ansible_env.HOME }}/n8n"
    state: present
    pull: always
    docker_cli: "{{ docker_bin }}"
  environment:
    DOCKER_HOST: "{{ docker_host }}"
  when: not ansible_check_mode
  tags: [n8n]

- name: "Déployer le workflow triage"
  ansible.builtin.template:
    src: workflow-triage.json.j2
    dest: "{{ n8n_data_dir }}/data/workflow-triage.json"
    mode: "0640"
  tags: [n8n]

- name: "Attendre que n8n soit prêt"
  ansible.builtin.uri:
    url: "http://localhost:{{ n8n_port }}/healthz"
    method: GET
    status_code: 200
    timeout: 10
  retries: 12
  delay: 10
  register: n8n_health
  until: n8n_health.status == 200
  when: not ansible_check_mode
  tags: [n8n]

- name: "Importer le workflow triage dans n8n"
  ansible.builtin.shell: >
    {{ docker_bin }} exec n8n
    n8n import:workflow --input=/home/node/.n8n/workflow-triage.json
  environment:
    DOCKER_HOST: "{{ docker_host }}"
  when: not ansible_check_mode
  changed_when: true
  tags: [n8n]
