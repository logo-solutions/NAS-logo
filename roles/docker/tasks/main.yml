---
# roles/docker — Colima (Docker runtime)


- name: "Vérifier si Docker (Colima) est déjà disponible"
  ansible.builtin.command:
    cmd: "{{ docker_bin }} info"
  environment:
    DOCKER_HOST: "{{ docker_host }}"
  register: docker_check
  changed_when: false
  failed_when: false
  tags: [docker]

- name: "Installer Docker CLI + Colima via Homebrew"
  community.general.homebrew:
    name:
      - docker
      - colima
    state: present
  when: docker_check.rc != 0
  tags: [docker]

- name: "Démarrer Colima si nécessaire"
  ansible.builtin.command:
    cmd: /opt/homebrew/bin/colima start
  environment:
    HOME: "/Users/{{ ansible_user_id }}"
    PATH: "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin"
  when: docker_check.rc != 0
  changed_when: true
  tags: [docker]

- name: "Déployer le script de démarrage Colima"
  ansible.builtin.template:
    src: colima-start.sh.j2
    dest: /usr/local/bin/nas-logo-colima-start.sh
    mode: "0755"
  become: true
  tags: [docker]

- name: "Déployer le LaunchAgent Colima"
  ansible.builtin.template:
    src: com.nas-logo.colima.plist.j2
    dest: "/Users/{{ ansible_user_id }}/Library/LaunchAgents/com.nas-logo.colima.plist"
    mode: "0644"
  register: colima_plist
  tags: [docker]

- name: "Charger (ou recharger) le LaunchAgent Colima"
  ansible.builtin.command:
    cmd: "launchctl bootout gui/{{ ansible_user_uid }} /Users/{{ ansible_user_id }}/Library/LaunchAgents/com.nas-logo.colima.plist"
  failed_when: false
  changed_when: false
  when: colima_plist.changed
  tags: [docker]

- name: "Activer le LaunchAgent Colima"
  ansible.builtin.command:
    cmd: "launchctl bootstrap gui/{{ ansible_user_uid }} /Users/{{ ansible_user_id }}/Library/LaunchAgents/com.nas-logo.colima.plist"
  changed_when: true
  when: colima_plist.changed
  tags: [docker]

- name: "Ajouter le SSD logousb dans les mounts Colima"
  ansible.builtin.lineinfile:
    path: "/Users/{{ ansible_user_id }}/.colima/default/colima.yaml"
    regexp: ".*location: /Volumes/logousb.*"
    line: "  - location: /Volumes/logousb"
    insertafter: "^mounts:"
  register: colima_mount_ssd
  tags: [docker]

- name: "Ajouter le HDD NAS-LOGO-DATA dans les mounts Colima"
  ansible.builtin.lineinfile:
    path: "/Users/{{ ansible_user_id }}/.colima/default/colima.yaml"
    regexp: ".*location: /Volumes/NAS-LOGO-DATA.*"
    line: "  - location: /Volumes/NAS-LOGO-DATA"
    insertafter: ".*location: /Volumes/logousb.*"
  register: colima_mount_hdd
  tags: [docker]

- name: "Supprimer docker-credential-desktop du config Docker (Colima incompatible)"
  ansible.builtin.lineinfile:
    path: "/Users/{{ ansible_user_id }}/.docker/config.json"
    regexp: '"credsStore"\s*:'
    state: absent
  tags: [docker]

- name: "Vérifier que Docker (Colima) répond"
  ansible.builtin.command:
    cmd: "{{ docker_bin }} info"
  environment:
    DOCKER_HOST: "{{ docker_host }}"
  register: docker_info
  retries: 12
  delay: 10
  until: docker_info.rc == 0
  changed_when: false
  tags: [docker]
