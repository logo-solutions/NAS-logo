---
# roles/docker — Colima (Docker runtime)


- name: "Vérifier si Docker (Colima) est déjà disponible"
  ansible.builtin.command:
    cmd: "{{ docker_bin }} info"
  environment:
    DOCKER_HOST: "{{ docker_host }}"
  register: docker_check
  changed_when: false
  failed_when: false
  tags: [docker]

- name: "Installer Docker CLI + Colima via Homebrew"
  community.general.homebrew:
    name:
      - docker
      - colima
    state: present
  when: docker_check.rc != 0
  tags: [docker]

- name: "Démarrer Colima si nécessaire"
  ansible.builtin.command:
    cmd: /opt/homebrew/bin/colima start
  environment:
    HOME: "/Users/{{ ansible_user_id }}"
    PATH: "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin"
  when: docker_check.rc != 0
  changed_when: true
  tags: [docker]

- name: "Déployer le script de démarrage Colima"
  ansible.builtin.template:
    src: colima-start.sh.j2
    dest: /usr/local/bin/nas-logo-colima-start.sh
    mode: "0755"
  become: true
  tags: [docker]

- name: "Déployer le LaunchAgent Colima"
  ansible.builtin.template:
    src: com.nas-logo.colima.plist.j2
    dest: "/Users/{{ ansible_user_id }}/Library/LaunchAgents/com.nas-logo.colima.plist"
    mode: "0644"
  register: colima_plist
  tags: [docker]

- name: "Charger (ou recharger) le LaunchAgent Colima"
  ansible.builtin.command:
    cmd: "launchctl bootout gui/{{ ansible_user_uid }} /Users/{{ ansible_user_id }}/Library/LaunchAgents/com.nas-logo.colima.plist"
  failed_when: false
  changed_when: false
  when: colima_plist.changed
  tags: [docker]

- name: "Activer le LaunchAgent Colima"
  ansible.builtin.command:
    cmd: "launchctl bootstrap gui/{{ ansible_user_uid }} /Users/{{ ansible_user_id }}/Library/LaunchAgents/com.nas-logo.colima.plist"
  changed_when: true
  when: colima_plist.changed
  tags: [docker]

- name: "Ajouter le SSD logousb dans les mounts Colima"
  ansible.builtin.lineinfile:
    path: "/Users/{{ ansible_user_id }}/.colima/default/colima.yaml"
    regexp: ".*location: /Volumes/logousb.*"
    line: "  - location: /Volumes/logousb"
    insertafter: "^mounts:"
  register: colima_mount_ssd
  tags: [docker]

- name: "Ajouter le HDD NAS-LOGO-DATA dans les mounts Colima"
  ansible.builtin.lineinfile:
    path: "/Users/{{ ansible_user_id }}/.colima/default/colima.yaml"
    regexp: ".*location: /Volumes/NAS-LOGO-DATA.*"
    line: "  - location: /Volumes/NAS-LOGO-DATA"
    insertafter: ".*location: /Volumes/logousb.*"
  register: colima_mount_hdd
  tags: [docker]

- name: "Supprimer docker-credential-desktop du config Docker (Colima incompatible)"
  ansible.builtin.lineinfile:
    path: "/Users/{{ ansible_user_id }}/.docker/config.json"
    regexp: '"credsStore"\s*:'
    state: absent
  tags: [docker]

- name: "Déployer le script d'arrêt propre"
  ansible.builtin.template:
    src: nas-logo-shutdown.sh.j2
    dest: /usr/local/bin/nas-logo-shutdown.sh
    mode: "0755"
  become: true
  tags: [docker, resilience]

- name: "Déployer le LaunchAgent arrêt propre"
  ansible.builtin.template:
    src: com.nas-logo.shutdown.plist.j2
    dest: "/Users/{{ ansible_user_id }}/Library/LaunchAgents/com.nas-logo.shutdown.plist"
    mode: "0644"
  register: shutdown_plist
  tags: [docker, resilience]

- name: "Charger le LaunchAgent arrêt propre"
  ansible.builtin.shell:
    cmd: |
      launchctl bootout gui/{{ ansible_user_uid }} /Users/{{ ansible_user_id }}/Library/LaunchAgents/com.nas-logo.shutdown.plist 2>/dev/null || true
      launchctl bootstrap gui/{{ ansible_user_uid }} /Users/{{ ansible_user_id }}/Library/LaunchAgents/com.nas-logo.shutdown.plist
  changed_when: true
  when: shutdown_plist.changed
  tags: [docker, resilience]

- name: "Déployer le script watchdog mounts Colima"
  ansible.builtin.template:
    src: nas-logo-mount-watchdog.sh.j2
    dest: /usr/local/bin/nas-logo-mount-watchdog.sh
    mode: "0755"
  become: true
  tags: [docker, resilience]

- name: "Déployer le LaunchAgent watchdog mounts (toutes les 2 min)"
  ansible.builtin.template:
    src: com.nas-logo.mount-watchdog.plist.j2
    dest: "/Users/{{ ansible_user_id }}/Library/LaunchAgents/com.nas-logo.mount-watchdog.plist"
    mode: "0644"
  register: watchdog_plist
  tags: [docker, resilience]

- name: "Charger le LaunchAgent watchdog mounts"
  ansible.builtin.shell:
    cmd: |
      launchctl bootout gui/{{ ansible_user_uid }} /Users/{{ ansible_user_id }}/Library/LaunchAgents/com.nas-logo.mount-watchdog.plist 2>/dev/null || true
      launchctl bootstrap gui/{{ ansible_user_uid }} /Users/{{ ansible_user_id }}/Library/LaunchAgents/com.nas-logo.mount-watchdog.plist
  changed_when: true
  when: watchdog_plist.changed
  tags: [docker, resilience]

- name: "Vérifier que Docker (Colima) répond"
  ansible.builtin.command:
    cmd: "{{ docker_bin }} info"
  environment:
    DOCKER_HOST: "{{ docker_host }}"
  register: docker_info
  retries: 12
  delay: 10
  until: docker_info.rc == 0
  changed_when: false
  tags: [docker]

- name: "Déployer script NFS configuration"
  ansible.builtin.template:
    src: nas-logo-nfs-setup.sh.j2
    dest: /usr/local/bin/nas-logo-nfs-setup.sh
    mode: "0755"
  become: true
  tags: [docker, nfs]

- name: "Configurer NFS export sur macOS (/etc/exports)"
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports.nas-logo
    mode: "0644"
  become: true
  tags: [docker, nfs]

- name: "Merger export NFS dans /etc/exports"
  ansible.builtin.shell:
    cmd: |
      grep -v "NAS-LOGO" /etc/exports > /tmp/exports.tmp 2>/dev/null || true
      cat /etc/exports.nas-logo >> /tmp/exports.tmp
      mv /tmp/exports.tmp /etc/exports
  become: true
  changed_when: true
  tags: [docker, nfs]

- name: "Activer et redémarrer NFS"
  ansible.builtin.shell:
    cmd: |
      nfsd enable
      nfsd restart
  become: true
  changed_when: true
  tags: [docker, nfs]

- name: "Vérifier NFS actif"
  ansible.builtin.command:
    cmd: "showmount -e localhost"
  register: nfs_exports
  changed_when: false
  tags: [docker, nfs]

- name: "Afficher exports NFS"
  ansible.builtin.debug:
    var: nfs_exports.stdout
  tags: [docker, nfs]

- name: "Déployer script mount NFS dans Colima"
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      set -e
      echo "=== Setup NFS mount dans Colima ==="

      # Installer NFS client
      if ! command -v mount.nfs &>/dev/null; then
        echo "Installing nfs-common..."
        sudo apt-get update >/dev/null 2>&1
        sudo apt-get install -y nfs-common >/dev/null 2>&1
      fi

      # Créer et monter NFS
      echo "Creating /mnt/photos..."
      sudo mkdir -p /mnt/photos

      echo "Mounting NFS..."
      sudo umount /mnt/photos 2>/dev/null || true
      sudo mount -t nfs -o vers=3,soft,timeo=10,retrans=3 host.lima.internal:/Volumes/NAS-LOGO-DATA /mnt/photos

      # Vérifier
      echo "✅ NFS mounted:"
      mount | grep /mnt/photos

      # Ajouter à fstab
      grep -q "/mnt/photos" /etc/fstab || echo "host.lima.internal:/Volumes/NAS-LOGO-DATA /mnt/photos nfs vers=3,soft,timeo=10,retrans=3,_netdev 0 0" | sudo tee -a /etc/fstab >/dev/null
      echo "✅ Done"
    dest: /tmp/nas-logo-mount-nfs.sh
    mode: "0755"
  tags: [docker, nfs]

- name: "Exécuter mount NFS dans Colima VM"
  ansible.builtin.command:
    cmd: "colima ssh /tmp/nas-logo-mount-nfs.sh"
  register: nfs_mount_result
  changed_when: "nfs_mount_result.rc == 0"
  tags: [docker, nfs]

- name: "Afficher résultat mount NFS"
  ansible.builtin.debug:
    var: nfs_mount_result.stdout_lines
  tags: [docker, nfs]
