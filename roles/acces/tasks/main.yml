---
# roles/acces — SSH hardening + clés autorisées

- name: "Configurer SSH (désactiver auth par mot de passe et root login)"
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config.d/nas-logo.conf
    mode: "0644"
    validate: sshd -t -f %s
  notify: reload sshd
  become: true
  tags: [acces, sshd]

- name: "Déployer les clés SSH autorisées"
  ansible.posix.authorized_key:
    user: "{{ mac_user }}"
    key: "{{ item.key }}"
    comment: "{{ item.comment }}"
    state: present
  loop: "{{ ssh_authorized_keys }}"
  when: ssh_authorized_keys is defined and ssh_authorized_keys | length > 0
  tags: [acces, ssh_keys]
