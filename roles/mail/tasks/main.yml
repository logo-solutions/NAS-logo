---
# roles/mail — indexeur mbox Gmail → Meilisearch + viewer HTML

- name: "Déployer l'indexeur mbox Gmail"
  ansible.builtin.template:
    src: index-mail.py.j2
    dest: /usr/local/bin/nas-logo-index-mail.py
    mode: "0755"
  become: true
  tags: [mail]

- name: "Déployer le viewer mail HTML"
  ansible.builtin.template:
    src: mail-viewer.html.j2
    dest: "{{ meilisearch_data_dir }}/ui/mail.html"
    mode: "0644"
  tags: [mail]

- name: "Planifier l'indexation mail hebdomadaire (dimanche 3h)"
  ansible.builtin.cron:
    name: "nas-logo-index-mail"
    minute: "0"
    hour: "3"
    weekday: "0"
    job: "/usr/local/bin/nas-logo-index-mail.py >> /tmp/nas-logo-index-mail.log 2>&1"
    user: "{{ mac_user }}"
  tags: [mail]

- name: "Lancer l'indexation initiale (une seule fois si l'index n'existe pas)"
  ansible.builtin.command:
    cmd: /usr/local/bin/nas-logo-index-mail.py
  changed_when: true
  when: not ansible_check_mode
  tags: [mail, mail-index]
