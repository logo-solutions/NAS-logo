---
# roles/monitoring — Prometheus + Grafana + cAdvisor + ntfy

- name: "Créer les répertoires de monitoring"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ monitoring_data_dir }}/prometheus"
    - "{{ monitoring_data_dir }}/prometheus/rules"
    - "{{ monitoring_data_dir }}/grafana"
    - "{{ monitoring_data_dir }}/ntfy"
    - "{{ monitoring_data_dir }}/ntfy-certs"
    - "{{ monitoring_data_dir }}/alertmanager"
    - "{{ ansible_env.HOME }}/monitoring"
  tags: [monitoring]

- name: "Récupérer le FQDN Tailscale pour le certificat ntfy"
  ansible.builtin.command:
    cmd: /opt/homebrew/bin/tailscale status --json
  register: ts_status_json
  changed_when: false
  tags: [monitoring, ntfy]

- name: "Extraire le FQDN Tailscale"
  ansible.builtin.set_fact:
    tailscale_fqdn: "{{ (ts_status_json.stdout | from_json)['Self']['DNSName'] | regex_replace('\\.$', '') }}"
  tags: [monitoring, ntfy]

- name: "Obtenir le certificat TLS Tailscale pour ntfy"
  ansible.builtin.command:
    cmd: >
      /opt/homebrew/bin/tailscale cert
      --cert-file {{ ntfy_certs_dir }}/cert.pem
      --key-file {{ ntfy_certs_dir }}/key.pem
      {{ tailscale_fqdn }}
  changed_when: true
  ignore_errors: true
  tags: [monitoring, ntfy]

- name: "Déployer la configuration Alertmanager"
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ monitoring_data_dir }}/alertmanager/alertmanager.yml"
    mode: "0640"
  notify: restart monitoring
  tags: [monitoring, prometheus]

- name: "Déployer les alerting rules Prometheus"
  ansible.builtin.template:
    src: nas-logo.rules.yml.j2
    dest: "{{ monitoring_data_dir }}/prometheus/rules/nas-logo.rules.yml"
    mode: "0640"
  notify: restart monitoring
  tags: [monitoring, prometheus]

- name: "Déployer la configuration Prometheus"
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_data_dir }}/prometheus/prometheus.yml"
    mode: "0640"
  notify: restart monitoring
  tags: [monitoring, prometheus]

- name: "Déployer docker-compose.monitoring.yml"
  ansible.builtin.template:
    src: docker-compose.monitoring.yml.j2
    dest: "{{ ansible_env.HOME }}/monitoring/docker-compose.yml"
    mode: "0640"
  notify: restart monitoring
  tags: [monitoring]

- name: "Démarrer la stack monitoring"
  community.docker.docker_compose_v2:
    project_src: "{{ ansible_env.HOME }}/monitoring"
    state: present
    pull: always
    docker_cli: "{{ docker_bin }}"
  environment:
    DOCKER_HOST: "{{ docker_host }}"
  tags: [monitoring]

- name: "Attendre que Grafana soit prêt"
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_port }}/api/health"
    method: GET
    status_code: 200
    timeout: 5
  retries: 12
  delay: 10
  register: grafana_health
  until: grafana_health.status == 200
  tags: [monitoring, grafana]

- name: "Créer la datasource Prometheus dans Grafana"
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_port }}/api/datasources"
    method: POST
    user: admin
    password: "{{ vault_grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: Prometheus
      type: prometheus
      url: "http://prometheus:{{ prometheus_port }}"
      access: proxy
      isDefault: true
    status_code: [200, 409]  # 409 = déjà existante
  tags: [monitoring, grafana]

- name: "Télécharger les dashboards depuis grafana.com"
  ansible.builtin.uri:
    url: "https://grafana.com/api/dashboards/{{ item }}/revisions/latest/download"
    method: GET
    return_content: true
  register: grafana_dashboard_json
  loop:
    - "{{ grafana_dashboard_cadvisor_id }}"
    - "{{ grafana_dashboard_node_id }}"
  tags: [monitoring, grafana]

- name: "Importer les dashboards communautaires Grafana"
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_port }}/api/dashboards/import"
    method: POST
    user: admin
    password: "{{ vault_grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      dashboard: "{{ item.content | from_json }}"
      overwrite: true
      inputs:
        - name: DS_PROMETHEUS
          type: datasource
          pluginId: prometheus
          value: Prometheus
      folderId: 0
    status_code: 200
  loop: "{{ grafana_dashboard_json.results }}"
  loop_control:
    label: "dashboard {{ item.item }}"
  when: item.content is defined
  tags: [monitoring, grafana]

- name: "Déployer le script d'alerte disque ntfy"
  ansible.builtin.template:
    src: healthcheck.sh.j2
    dest: /usr/local/bin/nas-logo-healthcheck.sh
    mode: "0755"
  become: true
  tags: [monitoring]

- name: "Déployer le LaunchAgent pour les alertes disque"
  ansible.builtin.template:
    src: com.nas-logo.healthcheck.plist.j2
    dest: "{{ ansible_env.HOME }}/Library/LaunchAgents/com.nas-logo.healthcheck.plist"
    mode: "0644"
  notify: reload healthcheck launchagent
  tags: [monitoring]
