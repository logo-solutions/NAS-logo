---
# roles/monitoring/tasks/main.yml

- name: Déployer le script de health check Immich
  template:
    src: healthcheck.sh.j2
    dest: "{{ ansible_env.HOME }}/immich/scripts/healthcheck.sh"
    mode: '0755'

- name: Planifier le health check toutes les 5 minutes
  cron:
    name: "Immich health check"
    minute: "*/5"
    job: "{{ ansible_env.HOME }}/immich/scripts/healthcheck.sh >> {{ ansible_env.HOME }}/immich/logs/healthcheck.log 2>&1"

- name: Planifier la vérification SMART hebdomadaire
  cron:
    name: "Immich SMART check"
    weekday: "0"
    hour: "3"
    minute: "0"
    job: "smartctl -H {{ ssd_mount_point }} | grep -v PASSED && curl -s -d 'SMART SSD : anomalie détectée !' https://ntfy.sh/{{ ntfy_topic }} || true"
