---
# roles/recherche — Meilisearch + indexeur NAS-logo

- name: "Créer les répertoires Meilisearch"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ meilisearch_data_dir }}/data"
    - "{{ meilisearch_data_dir }}/ui"
    - "{{ ansible_env.HOME }}/recherche"
    - "{{ files_dir }}/notes"
  tags: [recherche]

- name: "Déployer la page de recherche"
  ansible.builtin.template:
    src: search.html.j2
    dest: "{{ meilisearch_data_dir }}/ui/index.html"
    mode: "0644"
  tags: [recherche]

- name: "Déployer docker-compose.recherche.yml"
  ansible.builtin.template:
    src: docker-compose.recherche.yml.j2
    dest: "{{ ansible_env.HOME }}/recherche/docker-compose.yml"
    mode: "0640"
  notify: restart recherche
  tags: [recherche]

- name: "Démarrer la stack recherche"
  community.docker.docker_compose_v2:
    project_src: "{{ ansible_env.HOME }}/recherche"
    state: present
    pull: missing
    docker_cli: "{{ docker_bin }}"
  environment:
    DOCKER_HOST: "{{ docker_host }}"
    PATH: "/Applications/Docker.app/Contents/Resources/bin:{{ ansible_env.PATH }}"
  tags: [recherche]

- name: "Déployer l'indexeur NAS-logo"
  ansible.builtin.template:
    src: index-nas-logo.py.j2
    dest: /usr/local/bin/nas-logo-index.py
    mode: "0755"
  become: true
  tags: [recherche]

- name: "Planifier l'indexation quotidienne à 2h"
  ansible.builtin.cron:
    name: "nas-logo-index"
    minute: "0"
    hour: "2"
    job: "/usr/local/bin/nas-logo-index.py >> /tmp/nas-logo-index.log 2>&1"
    user: "{{ mac_user }}"
  tags: [recherche]
