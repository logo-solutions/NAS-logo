---
# roles/whisper — faster-whisper-server (API REST OpenAI-compatible)

- name: "Créer les répertoires Whisper sur le SSD"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ whisper_data_dir }}/models"
    - "{{ ansible_env.HOME }}/whisper"
  tags: [whisper]

- name: "Déployer docker-compose.whisper.yml"
  ansible.builtin.template:
    src: docker-compose.whisper.yml.j2
    dest: "{{ ansible_env.HOME }}/whisper/docker-compose.yml"
    mode: "0640"
  notify: restart whisper
  tags: [whisper]

- name: "Démarrer la stack Whisper"
  community.docker.docker_compose_v2:
    project_src: "{{ ansible_env.HOME }}/whisper"
    state: present
    pull: missing
    docker_cli: "{{ docker_bin }}"
  environment:
    DOCKER_HOST: "{{ docker_host }}"
  when: not ansible_check_mode
  tags: [whisper]

- name: "Attendre que Whisper soit prêt (le modèle medium prend ~60s au 1er démarrage)"
  ansible.builtin.uri:
    url: "http://localhost:{{ whisper_port }}/health"
    method: GET
    status_code: 200
    timeout: 10
  retries: 18
  delay: 10
  register: whisper_health
  until: whisper_health.status == 200
  when: not ansible_check_mode
  tags: [whisper]
