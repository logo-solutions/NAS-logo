---
# roles/securite — Tailscale + firewall macOS

- name: "Vérifier que Tailscale est connecté"
  ansible.builtin.command:
    cmd: /usr/local/bin/tailscale status
  register: tailscale_status
  changed_when: false
  failed_when: tailscale_status.rc != 0
  tags: [securite, tailscale]

- name: "Activer le firewall macOS (Application Firewall)"
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on
  become: true
  register: firewall_result
  changed_when: "'enabled' not in firewall_result.stdout"
  failed_when: firewall_result.rc != 0
  tags: [securite]

- name: "Activer le mode furtif du firewall macOS"
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --setstealthmode on
  become: true
  register: stealth_result
  changed_when: "'enabled' not in stealth_result.stdout"
  failed_when: stealth_result.rc != 0
  tags: [securite]
