---
# roles/securite — Tailscale + firewall macOS

# ── Tailscale ──────────────────────────────────────────────────────────────────

- name: "Installer Tailscale via Homebrew"
  community.general.homebrew_cask:
    name: tailscale
    state: present
  tags: [securite, tailscale]

- name: "Vérifier l'état Tailscale (BackendState)"
  ansible.builtin.command:
    cmd: /usr/local/bin/tailscale status --json
  register: tailscale_status_json
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [securite, tailscale]

- name: "Authentifier Tailscale si non connecté"
  ansible.builtin.command: >
    /usr/local/bin/tailscale up
    --authkey="{{ vault_tailscale_authkey }}"
    --hostname="{{ tailscale_hostname }}"
    --advertise-tags="{{ tailscale_tags }}"
    --accept-dns=false
    --reset
  when: >
    tailscale_status_json.rc != 0 or
    (tailscale_status_json.stdout | default('{}') | from_json).get('BackendState', '') != "Running"
  no_log: true
  changed_when: true
  tags: [securite, tailscale]

- name: "Vérifier que Tailscale est connecté"
  ansible.builtin.command:
    cmd: /usr/local/bin/tailscale status --json
  register: tailscale_final
  changed_when: false
  check_mode: false
  failed_when:
    - tailscale_final.stdout | length > 0
    - (tailscale_final.stdout | from_json).BackendState != "Running"
  tags: [securite, tailscale]

- name: "Afficher l'IP Tailscale"
  ansible.builtin.debug:
    msg: "IP Tailscale : {{ (tailscale_final.stdout | from_json).TailscaleIPs | first }}"
  when: tailscale_final.stdout | length > 0
  tags: [securite, tailscale]

- name: "Déployer le script de démarrage Tailscale"
  ansible.builtin.template:
    src: tailscale-start.sh.j2
    dest: /usr/local/bin/nas-logo-tailscale-start.sh
    mode: "0755"
  become: true
  tags: [securite, tailscale]

- name: "Déployer le LaunchAgent Tailscale"
  ansible.builtin.template:
    src: com.nas-logo.tailscale.plist.j2
    dest: "/Users/{{ ansible_user_id }}/Library/LaunchAgents/com.nas-logo.tailscale.plist"
    mode: "0644"
  register: tailscale_plist
  tags: [securite, tailscale]

- name: "Charger (ou recharger) le LaunchAgent Tailscale"
  ansible.builtin.command:
    cmd: "launchctl bootout gui/{{ ansible_user_uid }} /Users/{{ ansible_user_id }}/Library/LaunchAgents/com.nas-logo.tailscale.plist"
  failed_when: false
  changed_when: false
  when: tailscale_plist.changed
  tags: [securite, tailscale]

- name: "Activer le LaunchAgent Tailscale"
  ansible.builtin.command:
    cmd: "launchctl bootstrap gui/{{ ansible_user_uid }} /Users/{{ ansible_user_id }}/Library/LaunchAgents/com.nas-logo.tailscale.plist"
  register: launchctl_bootstrap
  failed_when:
    - launchctl_bootstrap.rc != 0
    - '"service already loaded" not in launchctl_bootstrap.stderr'
  changed_when: launchctl_bootstrap.rc == 0
  tags: [securite, tailscale]

- name: "Déployer la config SSH (Tailscale uniquement)"
  ansible.builtin.template:
    src: nas-logo-ssh.conf.j2
    dest: /etc/ssh/sshd_config.d/nas-logo.conf
    mode: "0644"
  become: true
  notify: restart sshd
  tags: [securite, ssh]

- name: "Déployer les règles pf NAS-logo"
  ansible.builtin.template:
    src: nas-logo-pf.conf.j2
    dest: /etc/pf.anchors/nas-logo
    mode: "0644"
  become: true
  notify: reload pf
  tags: [securite, firewall]

- name: "Ajouter l'anchor nas-logo dans pf.conf"
  ansible.builtin.lineinfile:
    path: /etc/pf.conf
    line: 'load anchor "nas-logo" from "/etc/pf.anchors/nas-logo"'
    regexp: 'nas-logo'
    insertafter: 'load anchor "com.apple"'
  become: true
  notify: reload pf
  tags: [securite, firewall]

- name: "Déployer le LaunchDaemon pf (rechargement au boot)"
  ansible.builtin.template:
    src: com.nas-logo.pf.plist.j2
    dest: /Library/LaunchDaemons/com.nas-logo.pf.plist
    mode: "0644"
  become: true
  notify: reload pf launchdaemon
  tags: [securite, firewall]

- name: "Activer le firewall macOS (Application Firewall)"
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on
  become: true
  register: firewall_result
  changed_when: "'enabled' not in firewall_result.stdout"
  failed_when: firewall_result.rc != 0
  tags: [securite]

- name: "Activer le mode furtif du firewall macOS"
  ansible.builtin.command:
    cmd: /usr/libexec/ApplicationFirewall/socketfilterfw --setstealthmode on
  become: true
  register: stealth_result
  changed_when: "'enabled' not in stealth_result.stdout"
  failed_when: stealth_result.rc != 0
  tags: [securite]
