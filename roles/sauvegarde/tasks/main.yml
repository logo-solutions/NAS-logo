---
# roles/sauvegarde/tasks/main.yml

- name: Créer le répertoire de config rclone
  file:
    path: "{{ ansible_env.HOME }}/.config/rclone"
    state: directory
    mode: '0700'

- name: Déployer la config rclone (Hetzner Storage Box)
  template:
    src: rclone.conf.j2
    dest: "{{ ansible_env.HOME }}/.config/rclone/rclone.conf"
    mode: '0600'
  no_log: true

- name: Déployer le script de sauvegarde quotidienne
  template:
    src: backup.sh.j2
    dest: "{{ ansible_env.HOME }}/immich/scripts/backup.sh"
    mode: '0755'

- name: Déployer le script de dump PostgreSQL
  template:
    src: dump_db.sh.j2
    dest: "{{ ansible_env.HOME }}/immich/scripts/dump_db.sh"
    mode: '0755'

- name: Planifier la sauvegarde quotidienne (2h du matin)
  cron:
    name: "Immich backup quotidien"
    hour: "2"
    minute: "0"
    job: "{{ ansible_env.HOME }}/immich/scripts/backup.sh >> {{ ansible_env.HOME }}/immich/logs/backup.log 2>&1"

- name: Planifier le dump DB (1h du matin)
  cron:
    name: "Immich dump PostgreSQL"
    hour: "1"
    minute: "0"
    job: "{{ ansible_env.HOME }}/immich/scripts/dump_db.sh >> {{ ansible_env.HOME }}/immich/logs/db-dump.log 2>&1"

- name: Planifier la vérification disque (toutes les 6h)
  cron:
    name: "Immich vérification disque"
    minute: "0"
    hour: "*/6"
    job: "{{ ansible_env.HOME }}/immich/scripts/check_disk.sh"

- name: Créer le répertoire de logs
  file:
    path: "{{ ansible_env.HOME }}/immich/logs"
    state: directory
    mode: '0750'
