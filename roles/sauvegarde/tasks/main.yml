---
# roles/sauvegarde — rclone + dump PostgreSQL + LaunchAgent cron

- name: "Créer les répertoires de sauvegarde et scripts"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ backup_dir }}"
    - "{{ backup_scripts_dir }}"
    - "{{ backup_log_dir }}"
    - "{{ ansible_env.HOME }}/.config/rclone"
  ignore_errors: true
  tags: [sauvegarde]

- name: "Déployer la configuration rclone"
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: "{{ ansible_env.HOME }}/.config/rclone/rclone.conf"
    mode: "0600"
  no_log: true
  tags: [sauvegarde, rclone]

- name: "Déployer le script de dump PostgreSQL"
  ansible.builtin.template:
    src: dump_db.sh.j2
    dest: "{{ backup_scripts_dir }}/nas-logo-dump-db.sh"
    mode: "0755"
  ignore_errors: true
  tags: [sauvegarde]

- name: "Déployer le script de sauvegarde rclone"
  ansible.builtin.template:
    src: backup.sh.j2
    dest: "{{ backup_scripts_dir }}/nas-logo-backup.sh"
    mode: "0755"
  ignore_errors: true
  tags: [sauvegarde, rclone]

- name: "Déployer le script de sauvegarde ciblée"
  ansible.builtin.template:
    src: backup-cible.sh.j2
    dest: "{{ backup_scripts_dir }}/nas-logo-backup-cible.sh"
    mode: "0755"
  ignore_errors: true
  tags: [sauvegarde]

- name: "Déployer le script de test de restauration"
  ansible.builtin.template:
    src: restore-test.sh.j2
    dest: "{{ backup_scripts_dir }}/nas-logo-restore-test.sh"
    mode: "0755"
  ignore_errors: true
  tags: [sauvegarde]

- name: "Déployer le script de restauration"
  ansible.builtin.template:
    src: restore.sh.j2
    dest: "{{ backup_scripts_dir }}/nas-logo-restore.sh"
    mode: "0755"
  ignore_errors: true
  tags: [sauvegarde, restore]

- name: "Déployer le script de dump Immich BD"
  ansible.builtin.template:
    src: dump-immich-db.sh.j2
    dest: "{{ backup_scripts_dir }}/nas-logo-dump-immich-db.sh"
    mode: "0755"
  ignore_errors: true
  tags: [sauvegarde, immich]

- name: "Déployer le script de backup env + conf"
  ansible.builtin.template:
    src: backup-configs.sh.j2
    dest: "{{ backup_scripts_dir }}/nas-logo-backup-configs.sh"
    mode: "0755"
  ignore_errors: true
  tags: [sauvegarde, configs]

- name: "Créer symlinks dans /usr/local/bin"
  ansible.builtin.file:
    src: "{{ backup_scripts_dir }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  become: true
  ignore_errors: true
  loop:
    - nas-logo-dump-db.sh
    - nas-logo-dump-immich-db.sh
    - nas-logo-backup.sh
    - nas-logo-backup-cible.sh
    - nas-logo-backup-configs.sh
    - nas-logo-restore-test.sh
    - nas-logo-restore.sh
  tags: [sauvegarde]

- name: "Déployer le LaunchAgent de sauvegarde quotidienne"
  ansible.builtin.template:
    src: com.nas-logo.backup.plist.j2
    dest: "{{ ansible_env.HOME }}/Library/LaunchAgents/com.nas-logo.backup.plist"
    mode: "0644"
  notify: reload backup launchagent
  tags: [sauvegarde]
