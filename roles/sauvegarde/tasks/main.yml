---
# roles/sauvegarde — rclone + dump PostgreSQL + LaunchAgent cron

- name: "Créer le répertoire de sauvegarde"
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    mode: "0700"
  tags: [sauvegarde]

- name: "Déployer la configuration rclone"
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: "{{ ansible_env.HOME }}/.config/rclone/rclone.conf"
    mode: "0600"
  no_log: true
  tags: [sauvegarde, rclone]

- name: "Déployer le script de dump PostgreSQL"
  ansible.builtin.template:
    src: dump_db.sh.j2
    dest: /usr/local/bin/nas-logo-dump-db.sh
    mode: "0750"
  become: true
  tags: [sauvegarde]

- name: "Déployer le script de sauvegarde rclone"
  ansible.builtin.template:
    src: backup.sh.j2
    dest: /usr/local/bin/nas-logo-backup.sh
    mode: "0750"
  become: true
  tags: [sauvegarde, rclone]

- name: "Déployer le LaunchAgent de sauvegarde quotidienne"
  ansible.builtin.template:
    src: com.nas-logo.backup.plist.j2
    dest: "{{ ansible_env.HOME }}/Library/LaunchAgents/com.nas-logo.backup.plist"
    mode: "0644"
  notify: reload backup launchagent
  tags: [sauvegarde]
