---
# roles/base/tasks/main.yml

- name: Vérifier que Homebrew est installé
  stat:
    path: /opt/homebrew/bin/brew
  register: brew_installed

- name: Installer les paquets Homebrew essentiels
  community.general.homebrew:
    name:
      - git
      - curl
      - rsync
      - rclone
      - smartmontools
      - watch
      - jq
    state: present

- name: Installer Caddy (reverse proxy)
  community.general.homebrew:
    name: caddy
    state: present

- name: Installer Tailscale
  community.general.homebrew_cask:
    name: tailscale
    state: present

- name: Configurer le PATH Homebrew dans .zshrc
  lineinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    line: 'eval "$(/opt/homebrew/bin/brew shellenv)"'
    create: true

- name: Créer le répertoire de travail principal
  file:
    path: "{{ immich_install_dir }}"
    state: directory
    mode: '0750'
