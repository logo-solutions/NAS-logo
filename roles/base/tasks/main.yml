---
# roles/base — Homebrew packages et collections Ansible

- name: "Installer les packages Homebrew essentiels"
  community.general.homebrew:
    name:
      - git
      - python3
      - rclone
      - tailscale
    state: present
  tags: [base]

- name: "Installer ansible-lint"
  community.general.homebrew:
    name: ansible-lint
    state: present
  tags: [base]

- name: "Installer les collections Ansible requises"
  ansible.builtin.command:
    cmd: ansible-galaxy collection install {{ item }} --upgrade
  loop: "{{ ansible_collections }}"
  changed_when: false
  tags: [base]
