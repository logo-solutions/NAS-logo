---
# roles/qualite/tasks/main.yml

- name: Installer pip3 si absent
  community.general.homebrew:
    name: python
    state: present

- name: Installer ansible-lint
  pip:
    name: ansible-lint
    state: present
    executable: pip3

- name: Installer Molecule et le driver Docker
  pip:
    name:
      - molecule
      - molecule-docker
    state: present
    executable: pip3

- name: Déployer la configuration ansible-lint
  copy:
    dest: "{{ ansible_env.HOME }}/immich-ansible/.ansible-lint"
    mode: '0644'
    content: |
      ---
      profile: production

      # Exclure les fichiers vault chiffrés
      exclude_paths:
        - inventory/group_vars/vault.yml

      # Règles à ignorer (justifiées)
      warn_list:
        - yaml[line-length]   # Lignes longues tolérées dans les templates

      # Forcer le nommage explicite de chaque tâche
      rules:
        name[missing]: error

- name: Déployer le script de validation complète
  copy:
    dest: "{{ ansible_env.HOME }}/immich-ansible/check.sh"
    mode: '0755'
    content: |
      #!/bin/bash
      # check.sh — valider le projet avant tout déploiement
      set -euo pipefail

      echo "==> Lint..."
      ansible-lint site.yml

      echo "==> Dry-run..."
      ansible-playbook -i inventory/hosts site.yml \
        --check --diff \
        --ask-vault-pass

      echo "==> Tout est OK. Vous pouvez déployer avec :"
      echo "    ansible-playbook -i inventory/hosts site.yml --ask-vault-pass"

- name: Déployer la configuration Molecule pour le rôle immich
  copy:
    dest: "{{ ansible_env.HOME }}/immich-ansible/roles/immich/molecule/default/molecule.yml"
    mode: '0644'
    content: |
      ---
      dependency:
        name: galaxy
      driver:
        name: docker
      platforms:
        - name: macmini-test
          image: geerlingguy/docker-ubuntu2204-ansible
          pre_build_image: true
      provisioner:
        name: ansible
        inventory:
          host_vars:
            macmini-test:
              ansible_connection: local
      verifier:
        name: ansible

- name: Initialiser Git si pas déjà fait
  command: git init
  args:
    chdir: "{{ ansible_env.HOME }}/immich-ansible"
    creates: "{{ ansible_env.HOME }}/immich-ansible/.git"

- name: Déployer le .gitignore
  copy:
    dest: "{{ ansible_env.HOME }}/immich-ansible/.gitignore"
    mode: '0644'
    content: |
      # Secrets — ne jamais committer en clair
      inventory/group_vars/vault.yml

      # Fichiers sensibles générés
      *.retry
      .env
      *.log

      # macOS
      .DS_Store
