# Usage : make install  →  ansible-playbook -i inventory/hosts site.yml --ask-vault-pass

- name: Provisioning NAS-logo
  hosts: macmini
  gather_facts: true

  roles:
    - role: base
      tags: [base]
    - role: stockage
      tags: [stockage]
    - role: acces
      tags: [acces]
    - role: securite
      tags: [securite, tailscale]
    - role: docker
      tags: [docker]
    - role: immich
      tags: [immich]
    - role: personnes
      tags: [personnes]
    - role: monitoring
      tags: [monitoring, prometheus, grafana]
    - role: sauvegarde
      tags: [sauvegarde]
    - role: paperless
      tags: [paperless]
    - role: recherche
      tags: [recherche, meilisearch]
    - role: smb
      tags: [smb]
    - role: gmail
      tags: [gmail]
    - role: n8n
      tags: [n8n]
    - role: whisper
      tags: [whisper]
    - role: mail
      tags: [mail]
