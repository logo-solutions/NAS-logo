---
# Variables globales NAS-logo — pas de secrets ici (voir vault.yml)

mac_user: "{{ ansible_user_id }}"

# SSD externe
ssd_mount_point: /Volumes/logousb/SSD/NAS-LOGO-VOLUME

# Immich
immich_version: release
immich_install_dir: "{{ ansible_env.HOME }}/immich"
immich_data_dir: "{{ ssd_mount_point }}/immich"
immich_db_dir: "{{ ssd_mount_point }}/immich-db"
immich_port: 2283
immich_db_name: immich
immich_db_user: immich
immich_db_password: "{{ lookup('ansible.builtin.password', ansible_env.HOME + '/.nas-logo-credentials/immich_db_password length=32 chars=ascii_letters,digits') }}"

# Monitoring
monitoring_data_dir: "{{ ssd_mount_point }}/monitoring"
grafana_port: 3000
prometheus_port: 9090
cadvisor_port: 8080
ntfy_port: 8090
ntfy_https_port: 8453
ntfy_certs_dir: "{{ monitoring_data_dir }}/ntfy-certs"
ntfy_topic: nas-logo
alert_disk_threshold: 80
grafana_dashboard_cadvisor_id: 14282
grafana_dashboard_node_id: 1860

# Sauvegarde
backup_dir: "{{ ssd_mount_point }}/backups"
hetzner_host: "{{ vault_hetzner_host }}"
hetzner_user: "{{ vault_hetzner_user }}"
hetzner_remote_path: immich-backup
backup_daily_keep: 7
backup_weekly_keep: 4
backup_monthly_keep: 12

# Tailscale
tailscale_hostname: macmini

# Immich
immich_api_key: "{{ vault_immich_api_key }}"

# Paperless-ngx
paperless_port: 8010
paperless_data_dir: "{{ ssd_mount_point }}/paperless"
paperless_ocr_threshold: 20
tesseract_bin: /opt/homebrew/bin/tesseract
triage_bin: /usr/local/bin/nas-logo-triage.sh
paperless_api_token: "{{ vault_paperless_api_token }}"
paperless_users:
  - username: alban
    password: "{{ vault_paperless_alban_password }}"
  - username: ilan
    password: "{{ vault_paperless_ilan_password }}"

# SMB
smb_share_name: "NAS-logo"
smb_share_path: "{{ files_dir }}"
smb_alban_password: "{{ vault_smb_alban_password }}"
smb_ilan_password: "{{ vault_smb_ilan_password }}"
smb_users:
  - username: alban
    fullname: Alban
    password: "{{ vault_smb_alban_password }}"
  - username: ilan
    fullname: Ilan
    password: "{{ vault_smb_ilan_password }}"

# Meilisearch
meilisearch_port: 7700
meilisearch_ui_port: 7701
meilisearch_data_dir: "{{ ssd_mount_point }}/meilisearch"
meilisearch_master_key: "{{ vault_meilisearch_master_key }}"
files_dir: "{{ ssd_mount_point }}/files"
nas_ip: "100.113.214.55"

# Immich — comptes famille
immich_users:
  - email: "alban@nas.local"
    name: "Alban"
    password: "{{ vault_immich_alban_password }}"
  - email: "ilan@nas.local"
    name: "Ilan"
    password: "{{ vault_immich_ilan_password }}"

# Gmail → Paperless / Immich
gmail_user: "{{ vault_gmail_user }}"

# Docker Desktop (Apple Silicon)
docker_bin: /Applications/Docker.app/Contents/Resources/bin/docker
docker_host: "unix:///Users/{{ ansible_user_id }}/.docker/run/docker.sock"

# Personnes — arbo par personne : imports/ paperless/ files/
personnes:
  - alice
  - loic-administratif
  - loic-formation
  - loic-pro
  - loic-immo
  - alo
  - alban
  - mahaut
  - ilan
  - famille-gourmelon
  - famille-vasseur

# n8n — automatisation de workflows
n8n_port: 5679
n8n_data_dir: "{{ ssd_mount_point }}/n8n"
n8n_user: admin

# Ansible collections requises
ansible_collections:
  - community.general
  - community.docker
  - ansible.posix
