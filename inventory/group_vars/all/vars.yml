---
# Variables globales NAS-logo — pas de secrets ici (voir vault.yml)

mac_user: "{{ ansible_user_id }}"

# SSD externe (données chaudes : DB, monitoring, index)
ssd_mount_point: /Volumes/logousb/SSD/NAS-LOGO-VOLUME

# HDD externe (données volumineuses froides, ajouté 2026-04-26)
# NOTE: Actuellement tout est sur SSD. hdd_mount_point ne sera montée que si un disque externe est branché
hdd_mount_point: /Volumes/NAS-LOGO-DATA

# NFS configuration — optimisation pour virtiofs + gros volumes (2026-05-08)
use_nfs: true
nfs_mount_path: /mnt/photos  # Montage NFS dans Colima
nfs_server: host.lima.internal  # Colima → macOS (host.lima.internal)
nfs_export: /Volumes/NAS-LOGO-DATA  # Export NFS sur macOS

# Fallback SSD si HDD absente (2026-05-03)
# Si NFS activé: use nfs_mount_path, sinon use hdd_mount_point
hdd_nas_volume: "{{ nfs_mount_path if use_nfs else hdd_mount_point }}"

# Immich — instance loic-perso
# SOURCE: immich/upload → CIBLE: personnes/loic-perso/immich/upload (structure standard Immich)
# Note: Immich crée upload/, thumbs/, encoded-video/ automatiquement — ne pas modifier
immich_version: release
immich_install_dir: "{{ ansible_env.HOME }}/immich"
immich_data_dir: "{{ hdd_mount_point }}/NAS-LOGO-VOLUME/personnes/loic-perso/immich"
immich_db_dir: "{{ ssd_mount_point }}/immich-db"
immich_port: 2283
immich_db_name: immich
immich_db_user: immich
immich_db_password: "{{ lookup('ansible.builtin.password', ansible_env.HOME + '/.nas-logo-credentials/immich_db_password length=32 chars=ascii_letters,digits') }}"

# Monitoring
monitoring_data_dir: "{{ ssd_mount_point }}/monitoring"
grafana_port: 3000
prometheus_port: 9090
cadvisor_port: 8080
ntfy_port: 8090
ntfy_https_port: 8453
ntfy_certs_dir: "{{ monitoring_data_dir }}/ntfy-certs"
ntfy_topic: nas-logo
alert_disk_threshold: 80
grafana_dashboard_cadvisor_id: 14282
grafana_dashboard_node_id: 1860

# Sauvegarde
backup_dir: "{{ hdd_mount_point }}/NAS-LOGO-VOLUME/backups"
backup_scripts_dir: "{{ ssd_mount_point }}/../Projects/NAS-logo/scripts/backup-restore"
backup_log_dir: "{{ backup_scripts_dir }}/logs"
backup_local_keep: 7
hetzner_host: "88.99.49.100"
hetzner_user: "{{ vault_hetzner_user }}"
hetzner_remote_path: immich-backup
backup_daily_keep: 7

# Tailscale
tailscale_hostname: macmini
tailscale_tags: "tag:nas"

# Immich
immich_api_key: "{{ vault_immich_api_key }}"

# Paperless-ngx
paperless_port: 8010
paperless_data_dir: "{{ hdd_nas_volume }}/paperless"
paperless_db_name: paperless
paperless_db_user: paperless
paperless_db_password: "{{ vault_paperless_db_password }}"
paperless_ocr_threshold: 20
tesseract_bin: /opt/homebrew/bin/tesseract
triage_bin: /usr/local/bin/nas-logo-triage.sh
paperless_api_token: "{{ vault_paperless_api_token }}"
paperless_users:
  - username: loic-perso
    password: "{{ vault_paperless_loic_perso_password }}"
  - username: loic-immo
    password: "{{ vault_paperless_loic_immo_password }}"
  - username: loic-pro
    password: "{{ vault_paperless_loic_pro_password }}"
  - username: alban
    password: "{{ vault_paperless_alban_password }}"
  - username: ilan
    password: "{{ vault_paperless_ilan_password }}"
  - username: mahaut
    password: "{{ vault_paperless_mahaut_password }}"
  - username: alice-perso
    password: "{{ vault_paperless_alice_perso_password }}"
  - username: alice-prof
    password: "{{ vault_paperless_alice_prof_password }}"

# Mapping sous-dossier consume → owner Paperless (private=true : invisible aux autres)
paperless_consume_users:
  loic-perso:
    username: loic-perso
    private: true
    storage_path: "loic-perso/{created_year}/{title}"
  loic-immo:
    username: loic-immo
    private: true
    storage_path: "loic-immo/{created_year}/{title}"
  loic-pro:
    username: loic-pro
    private: true
    storage_path: "loic-pro/{created_year}/{title}"
  alban:
    username: alban
    private: true
    storage_path: "alban/{created_year}/{title}"
  ilan:
    username: ilan
    private: true
    storage_path: "ilan/{created_year}/{title}"
  mahaut:
    username: mahaut
    private: true
    storage_path: "mahaut/{created_year}/{title}"
  alice-perso:
    username: alice-perso
    private: true
    storage_path: "alice-perso/{created_year}/{title}"
  alice-prof:
    username: alice-prof
    private: true
    storage_path: "alice-prof/{created_year}/{title}"
  famille:
    username: admin
    private: false
    storage_path: "famille/{created_year}/{title}"

# SMB
smb_share_name: "NAS-logo"
smb_share_path: "{{ files_dir }}"
smb_users:
  - username: alban
    fullname: Alban
    password: "{{ vault_smb_alban_password }}"
  - username: ilan
    fullname: Ilan
    password: "{{ vault_smb_ilan_password }}"
  - username: alice
    fullname: Alice
    password: "{{ vault_smb_alice_password }}"

# Meilisearch
meilisearch_version: "v1.42.1"
meilisearch_port: 7700
meilisearch_ui_port: 7701
meilisearch_data_dir: "{{ ssd_mount_point }}/meilisearch"
meilisearch_master_key: "{{ vault_meilisearch_master_key }}"
files_dir: "{{ hdd_nas_volume }}/files"
nas_ip: "100.113.214.55"

# Immich — comptes famille
immich_users:
  - email: "loic-perso@nas.local"
    name: "Loïc Perso"
    password: "{{ vault_immich_loic_perso_password }}"
  - email: "loic-immo@nas.local"
    name: "Loïc Immo"
    password: "{{ vault_immich_loic_immo_password }}"
  - email: "loic-pro@nas.local"
    name: "Loïc Pro"
    password: "{{ vault_immich_loic_pro_password }}"
  - email: "alban@nas.local"
    name: "Alban"
    password: "{{ vault_immich_alban_password }}"
  - email: "ilan@nas.local"
    name: "Ilan"
    password: "{{ vault_immich_ilan_password }}"
  - email: "mahaut@nas.local"
    name: "Mahaut"
    password: "{{ vault_immich_mahaut_password }}"
  - email: "alice-perso@nas.local"
    name: "Alice Perso"
    password: "{{ vault_immich_alice_perso_password }}"
  - email: "alice-prof@nas.local"
    name: "Alice Prof"
    password: "{{ vault_immich_alice_prof_password }}"

# Gmail → Paperless / Immich
gmail_user: "{{ vault_gmail_user }}"

# Docker — Colima (Apple Silicon)
docker_bin: /opt/homebrew/bin/docker
docker_host: "unix:///Users/{{ ansible_user_id }}/.colima/default/docker.sock"

# Personnes — arbo par personne : imports/ paperless/ files/
personnes:
  - alice
  - loic-administratif
  - loic-formation
  - loic-pro
  - loic-immo
  - alo
  - alban
  - mahaut
  - ilan
  - famille-gourmelon
  - famille-vasseur

# Whisper — transcription audio → texte
whisper_port: 8020
whisper_data_dir: "{{ ssd_mount_point }}/whisper"
whisper_model: small
whisper_language: fr

# n8n — automatisation de workflows
n8n_port: 5679
n8n_data_dir: "{{ ssd_mount_point }}/n8n"
n8n_user: admin
n8n_db_password: "{{ vault_n8n_db_password }}"

# Mail — indexeur mbox Gmail + viewer Meilisearch
mail_archives_dir: /Volumes/NAS-LOGO-DATA/MAIL

# SSH — clés publiques autorisées
ssh_authorized_keys:
  - comment: "alice-windows"
    key: "{{ vault_alice_ssh_public_key }}"

# Ansible collections requises
ansible_collections:
  - community.general
  - community.docker
  - ansible.posix
