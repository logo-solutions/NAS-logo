# inventory/group_vars/all.yml
# Variables globales — valeurs sensibles dans vault.yml

# Utilisateur système
mac_user: "{{ ansible_user_id }}"

# Chemin du SSD externe
ssd_mount_point: "/Volumes/ImmichData"

# Immich
immich_version: "v1.106.4"
immich_install_dir: "{{ ansible_env.HOME }}/immich"
immich_data_dir: "{{ ssd_mount_point }}/immich"
immich_db_dir: "{{ ssd_mount_point }}/immich-db"
immich_port: 2283

# Hetzner Storage Box
hetzner_host: "votre-box.your-storagebox.de"
hetzner_user: "votre-user"
hetzner_remote_path: "/immich-backup"
hetzner_backup_dir: "{{ ssd_mount_point }}/backups"

# Sauvegarde — rétention
backup_daily_keep: 7
backup_weekly_keep: 4
backup_monthly_keep: 12

# Monitoring — alertes
alert_disk_threshold: 80
ntfy_topic: "immich-alerts-votre-token"

# Tailscale
tailscale_authkey: "{{ vault_tailscale_authkey }}"

# Caddy reverse proxy
caddy_domain: "immich.votre-domaine.ts.net"
